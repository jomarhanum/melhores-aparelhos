# Publica o site na Vercel a cada push na main (inclui os guias commitados pelo n8n).
# O projeto da Vercel não está ligado ao GitHub; o deploy é feito pela CLI com o secret VERCEL_TOKEN.
name: Deploy na Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_0tFScbgcEtX8Csq6NFQsg747
  VERCEL_PROJECT_ID: prj_LU41Kky2noLQbZZ0POHOOqwab3vY

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # ffmpeg gera os Reels (/social/reel/*.mp4). Sem ele o build segue, só sem os Reels.
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: npm install --global vercel@60.1.3
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
